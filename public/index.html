<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- <Theme color for browser address bar (adjust to match your brand color)> -->
    <meta name="theme-color" content="#54387a" />

    <title>Lumina – ReactJS Portfolio Template by Sobia Soomro</title>

    <!-- Basic SEO Meta Tags -->
    <meta
      name="description"
      content="Lumina is a ReactJS personal portfolio template built to help developers showcase their projects, blogs, and skills beautifully."
    />
    <meta name="author" content="Sobia Soomro" />

    <!-- Open Graph Meta Tags (for social sharing) -->
    <!-- Update 'og:url' and 'og:image' with your own live site URL and preview image -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://react-portfolio-template-indol.vercel.app/"
    />
    <meta property="og:title" content="Lumina – ReactJS Portfolio Template" />
    <meta
      property="og:description"
      content="Showcase your projects and skills with Lumina – a clean and modern ReactJS portfolio template."
    />
    <meta
      property="og:image"
      content="https://react-portfolio-template-indol.vercel.app/lumina.webp"
    />

    <!-- Twitter Card Meta Tags (for Twitter preview) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lumina – ReactJS Portfolio Template" />
    <meta
      name="twitter:description"
      content="A sleek ReactJS portfolio template to showcase your work beautifully."
    />
    <meta
      name="twitter:image"
      content="https://react-portfolio-template-indol.vercel.app/lumina.webp"
    />

    <!-- Google Fonts (change the font family if needed) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="font"
      href="https://fonts.gstatic.com/s/inter/v12/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMaG8Ph.ttf"
      type="font/ttf"
      crossorigin
    />

    <!-- Favicon (replace with your logo if desired) -->
    <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
  </head>

  <body>
    <!-- This message shows if JavaScript is disabled -->
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- React app mounts here -->
    <div id="root"></div>
  </body>
</html>
