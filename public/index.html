<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#54387a" />
    <meta
      name="description"
      content="Lumina is a ReactJS personal portfolio template showcasing projects, blogs, and technical skills."
    />
    <meta
      name="keywords"
      content="React portfolio, developer template, personal website, ReactJS, frontend portfolio, Lumina, developer showcase"
    />

    <!-- Social Preview -->
    <meta
      property="og:title"
      content="Lumina | ReactJS Portfolio Template - Sobia Soomro"
    />
    <meta
      property="og:description"
      content="Lumina is a ReactJS personal portfolio template showcasing projects, blogs, and technical skills."
    />
    <meta property="og:image" content="%PUBLIC_URL%/lumina.webp" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:title"
      content="Lumina | ReactJS Portfolio Template - Sobia Soomro"
    />

      name="twitter:description"
      content="Lumina is a ReactJS personal portfolio template showcasing projects, blogs, and technical skills."

    <!-- Theme Loader (prevents flash) -->
    <script>
      const saved = localStorage.getItem("theme");
      if (saved && JSON.parse(saved)) {
        document.documentElement.classList.add("dark");
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />

    <title>Lumina - Personal Portfolio ReactJS Template by Sobia Soomro</title>
  </head>

    <div id="root"></div>
